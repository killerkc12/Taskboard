    // If this page can't load its own files (e.g. a saved offline copy points to files
    // from an older version), clear the saved copy and reload once.
    (function () {
      function recover() {
        try { if (sessionStorage.getItem('pwa_recover')) return; sessionStorage.setItem('pwa_recover', '1'); } catch (e) { return; }
        var jobs = [];
        if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      }
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
          var u = t.src || t.href || '';
          if (u.indexOf(location.origin + '/assets/') === 0) recover();
        }
      }, true);
    })();
  </script>
